[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-agent"
version = "0.1.0"
description = "AI agent that aggregates job postings (Greenhouse/Lever/RemoteOK), scores fit against a resume, and surfaces a ranked shortlist via a Streamlit dashboard."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "PyYAML>=6.0",
    "openai>=1.30",
    "langchain>=0.2",
    "langgraph>=0.1",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.14", "responses>=0.25"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
